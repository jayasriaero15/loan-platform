server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: customer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loansdb}
    username: ${DB_USER:loan}
    password: ${DB_PASSWORD:loan}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: customer-service

app:
  version: ${APP_VERSION:1.0.0}
