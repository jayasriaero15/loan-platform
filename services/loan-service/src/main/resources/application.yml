server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: loan-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loansdb}
    username: ${DB_USER:loan}
    password: ${DB_PASSWORD:loan}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: loan-service

app:
  version: ${APP_VERSION:1.0.0}

# Downstream services (override with env: SERVICES_CUSTOMER_URL etc.)
services:
  customer:
    url: ${SERVICES_CUSTOMER_URL:http://localhost:8081}
  document:
    url: ${SERVICES_DOCUMENT_URL:http://localhost:8082}
  notification:
    url: ${SERVICES_NOTIFICATION_URL:http://localhost:8083}

# Loan eligibility engine rules (tuned differently in v2 for the canary demo)
eligibility:
  min-credit-score: ${ELIGIBILITY_MIN_CREDIT_SCORE:650}
  max-emi-ratio: ${ELIGIBILITY_MAX_EMI_RATIO:0.5}
  max-income-multiple: ${ELIGIBILITY_MAX_INCOME_MULTIPLE:20}
  annual-rate: ${ELIGIBILITY_ANNUAL_RATE:0.12}
