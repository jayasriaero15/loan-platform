server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notification-service


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: notification-service

app:
  version: ${APP_VERSION:1.0.0}
