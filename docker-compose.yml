# Local smoke test only. Real deployment = Helm + ArgoCD on GKE.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loansdb
      POSTGRES_USER: loan
      POSTGRES_PASSWORD: loan
    ports: ["5432:5432"]

  customer-service:
    build: ./services/customer-service
    environment: &db
      DB_URL: jdbc:postgresql://postgres:5432/loansdb
      DB_USER: loan
      DB_PASSWORD: loan
    depends_on: [postgres]

  document-service:
    build: ./services/document-service
    environment: *db
    depends_on: [postgres]

  notification-service:
    build: ./services/notification-service

  loan-service:
    build: ./services/loan-service
    environment:
      <<: *db
      SERVICES_CUSTOMER_URL: http://customer-service:8080
      SERVICES_DOCUMENT_URL: http://document-service:8080
      SERVICES_NOTIFICATION_URL: http://notification-service:8080
    depends_on: [postgres, customer-service, document-service, notification-service]

  frontend:
    build: ./frontend
    environment:
      DNS_RESOLVER: 127.0.0.11
    ports: ["8080:8080"]
    depends_on: [loan-service]
