appName: customer-service
version: v1
replicaCount: 2
image:
  repository: docker.io/YOUR_DOCKERHUB_USER/customer-service
  tag: "1.0.0"
env:
  DB_URL: jdbc:postgresql://postgres:5432/loansdb
secretEnv:
  - { name: DB_USER,     secretName: postgres-credentials, key: DB_USER }
  - { name: DB_PASSWORD, secretName: postgres-credentials, key: DB_PASSWORD }
