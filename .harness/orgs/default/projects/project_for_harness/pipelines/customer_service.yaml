pipeline:
  description: Clones the loan-platform repo and builds customer-service with Maven on Java 17.
  tags:
    ai_generated: ""
  stages:
    - steps:
        - run:
            container:
              image: maven:3.9-eclipse-temurin-17
            script: |-
              java -version
              mvn -version
              git clone https://github.com/jayasriaero15/loan-platform.git
              mvn -f loan-platform/services/customer-service/pom.xml -B clean package
            shell: bash
          name: git clone and maven build
          id: git_clone_and_maven_build
        - name: customer-service docker build
          id: customer_service_docker_build
          build:
            uses: buildAndPushToGAR
            with:
              connector: connector_Gcp_c109
              host: asia-south1-docker.pkg.dev
              project_id: project-76f55662-b24c-481a-88e
              image_name: spring-app-repo/customer-service
              tags:
                - <+pipeline.sequenceId>
                - <+pipeline.gitCommit>
              caching: true
              dockerfile: loan-platform/services/customer-service/Dockerfile
              context: loan-platform/services/customer-service
      name: git clone and build
      id: git_clone_and_build
    - name: Deploy Kubernetes_customer_service
      id: Deploy_Kubernetes_customer_service
      service:
        type: kubernetes
        items:
          - service_kubernetes_customer_service
      environment:
        items:
          - id: environment_env_customer_service
            deploy-to: infrastructure_kubernetes_7fa9
      steps:
        - name: Kubernetes Rolling Deploy
          id: k8sRollingDeployStep
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - name: Kubernetes Rolling Rollback
                id: k8sRollingRollbackStep
                template:
                  uses: k8sRollingRollbackStep
          id: k8sRollingRollback
          name: Kubernetes Rolling Rollback
      on-failure:
        errors: all
        action: stage-rollback
      runtime:
        kubernetes:
          connector: gke_learning_cluster
          namespace: default
